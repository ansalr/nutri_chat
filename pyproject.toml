[project]
name = "nutri-chat"
version = "0.1.0"
description = "Detect food neutrients and calories"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.6.12",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
]

[project.scripts]
nutri-chat = "nutri_chat:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
